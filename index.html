<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nick - Luxury Web Design and Development</title>
<meta name="description" content="Independent web designer and developer crafting premium websites, landing pages and apps with cinematic motion and flawless detail.">
<meta property="og:title" content="Nick - Luxury Web Design and Development">
<meta property="og:description" content="Premium websites that make your brand feel priceless.">
<meta property="og:image" content="img/og.webp"><!-- ЗМІНИТИ -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0b;--ink:#f3ede2;--muted:#9a9487;--gold:#c9a86a;--gold2:#f0d9a5;--line:rgba(243,237,226,.13);--card:#121214; /* ЗМІНИТИ: кольори */
--h:'Cormorant Garamond',Georgia,serif;--b:'Inter',Arial,sans-serif}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.7 var(--b);overflow-x:hidden}
body.fc,body.fc *{cursor:none!important}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold);color:#000}
:focus-visible{outline:2px solid var(--gold);outline-offset:4px}
[hidden]{display:none!important}
section{padding:clamp(90px,13vw,180px) clamp(20px,6vw,96px);max-width:1400px;margin:auto;position:relative}
h1,h2,h3{font-family:var(--h);font-weight:500;line-height:.98;letter-spacing:-.02em}
h1{font-size:clamp(52px,10.5vw,170px)}
h2{font-size:clamp(42px,7vw,104px);margin-bottom:56px}
h3{font-size:30px}
i,em{font-style:italic;color:var(--gold)}
.tag{font:500 12px var(--b);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:16px;margin-bottom:28px}
.tag:before{content:"";width:44px;height:1px;background:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:12px;padding:20px 38px;border-radius:99px;font:500 15px var(--b);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--gold);color:var(--ink);background:transparent;position:relative;overflow:hidden;transition:color .4s,transform .3s;cursor:pointer;z-index:0}
.btn:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,var(--gold),var(--gold2));transform:translateY(101%);transition:transform .45s cubic-bezier(.7,0,.2,1);z-index:-1}
.btn:hover{color:#0a0a0b}.btn:hover:before{transform:none}
.btn.solid{background:linear-gradient(120deg,var(--gold),var(--gold2));color:#0a0a0b}
.btn.solid:before{background:var(--ink)}
.btn:active{transform:scale(.96)}
/* cursor */
.cur,.ring{position:fixed;left:0;top:0;z-index:999;pointer-events:none;opacity:0;transition:opacity .3s}
body.fc .cur,body.fc .ring{opacity:1}
.cur{width:8px;height:8px;margin:-4px;border-radius:50%;background:var(--gold2)}
.ring b{display:block;width:46px;height:46px;margin:-23px;border-radius:50%;border:1.5px solid var(--gold);transition:transform .35s,background .35s}
.ring.big b{transform:scale(1.8);background:rgba(201,168,106,.16)}
.bar{position:fixed;left:0;top:0;height:3px;width:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));transform-origin:left;transform:scaleX(0);z-index:60}
.pre{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;font:italic 500 48px var(--h);color:var(--gold);transition:opacity .8s .5s,visibility .8s .5s}
.pre.off{opacity:0;visibility:hidden}
/* header + menu */
.logo{position:fixed;left:clamp(20px,4vw,48px);top:26px;z-index:50;font:600 28px var(--h);letter-spacing:.04em}
.burger{position:fixed;right:clamp(16px,3vw,36px);top:16px;z-index:70;width:60px;height:60px;border-radius:50%;border:1px solid var(--gold);background:rgba(10,10,11,.6);backdrop-filter:blur(10px);display:grid;place-content:center;gap:7px;cursor:pointer;transition:background .3s}
.burger:hover{background:var(--gold)}.burger:hover i{background:#000}
.burger i{display:block;width:24px;height:1.5px;background:var(--ink);transition:.35s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(4.2px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){transform:translateY(-4.2px) rotate(-45deg)}
nav{position:fixed;inset:0;z-index:65;background:rgba(10,10,11,.97);display:grid;place-items:center;clip-path:circle(0 at calc(100% - 46px) 46px);transition:clip-path .8s cubic-bezier(.7,0,.2,1);visibility:hidden}
nav.open{clip-path:circle(150% at calc(100% - 46px) 46px);visibility:visible}
nav a{display:block;font:500 clamp(40px,8vw,88px)/1.15 var(--h);color:var(--muted);transition:color .3s,transform .4s;width:fit-content}
nav a:hover,nav a.active{color:var(--gold2);transform:translateX(18px)}
nav a small{font:500 12px var(--b);letter-spacing:.2em;color:var(--gold);margin-right:18px;vertical-align:top}
.top{position:fixed;right:24px;bottom:24px;z-index:50;width:52px;height:52px;border-radius:50%;border:1px solid var(--gold);background:rgba(10,10,11,.7);color:var(--gold);font-size:20px;opacity:0;pointer-events:none;transition:.3s;cursor:pointer}
.top.show{opacity:1;pointer-events:auto}.top:hover{background:var(--gold);color:#000;transform:translateY(-4px)}
/* hero */
#home{min-height:100vh;max-width:none;display:grid;align-content:center;overflow:hidden;padding-top:130px}
.hin{max-width:1400px;width:100%;margin:auto;position:relative;z-index:2}
#home p.lead{max-width:540px;font-size:19px;color:var(--muted);margin:36px 0 44px}
.btns{display:flex;gap:18px;flex-wrap:wrap}
.w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.12em;margin-right:.22em}
.w>span{display:inline-block;transform:translateY(110%);animation:up 1.1s cubic-bezier(.2,.8,.2,1) forwards;animation-delay:calc(var(--d) + .9s)}
@keyframes up{to{transform:none}}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 14s ease-in-out infinite}
.o1{width:44vw;height:44vw;right:-8vw;top:6vh;background:radial-gradient(circle,#c9a86a,transparent 70%)}
.o2{width:30vw;height:30vw;left:-8vw;bottom:-6vh;background:radial-gradient(circle,#7a4b2a,transparent 70%);animation-delay:-6s}
@keyframes drift{50%{transform:translate(40px,-30px) scale(1.12)}}
.spin{position:absolute;right:6vw;top:22vh;width:clamp(150px,26vw,380px);animation:rot 40s linear infinite;opacity:.8}
@keyframes rot{to{transform:rotate(360deg)}}
.scroll{position:absolute;left:50%;bottom:28px;width:1px;height:70px;background:linear-gradient(var(--gold),transparent);animation:sc 2s infinite}
@keyframes sc{50%{transform:scaleY(.4);transform-origin:top}}
.marq{border-block:1px solid var(--line);overflow:hidden;white-space:nowrap;padding:26px 0}
.marq div{display:inline-block;animation:mq 30s linear infinite;font:italic 500 clamp(28px,4vw,52px) var(--h);color:var(--muted)}
.marq span{margin:0 34px}.marq b{color:var(--gold);font-weight:400}
@keyframes mq{to{transform:translateX(-50%)}}
/* about */
.about{display:grid;grid-template-columns:1fr 1.25fr;gap:clamp(36px,7vw,110px);align-items:center}
.photo{aspect-ratio:4/5;border-radius:200px 200px 24px 24px;background:#111 center/cover;border:1px solid var(--gold);box-shadow:0 40px 120px rgba(201,168,106,.15)}
.about p{color:var(--muted)}
.skills{display:flex;flex-wrap:wrap;gap:10px;margin:32px 0}
.skills span{border:1px solid var(--line);padding:9px 20px;border-radius:99px;font-size:14px;transition:.3s}
.skills span:hover{border-color:var(--gold);color:var(--gold2);transform:translateY(-3px)}
.stats{display:flex;gap:clamp(24px,5vw,64px)}
.stats b{font:500 clamp(46px,6vw,76px)/1 var(--h);color:var(--gold2);display:block}
/* services */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:26px;padding:40px 34px;overflow:hidden;transition:transform .25s,border-color .4s;transform-style:preserve-3d}
.card:before{content:"";position:absolute;inset:0;background:radial-gradient(420px circle at var(--mx,50%) var(--my,0%),rgba(201,168,106,.2),transparent 60%);opacity:0;transition:opacity .4s}
.card:hover{border-color:var(--gold)}.card:hover:before{opacity:1}
.card .n{font:italic 500 22px var(--h);color:var(--gold);display:block;margin-bottom:70px}
.card p{color:var(--muted);margin-top:14px;font-size:16px;position:relative}
.card h3,.card .n{position:relative}
/* portfolio */
.proj{display:grid;grid-template-columns:1.25fr 1fr;gap:clamp(28px,5vw,80px);align-items:center;padding:56px 0;border-top:1px solid var(--line)}
.proj:nth-child(even) .shot{order:2}
.shot{aspect-ratio:3/2;border-radius:26px;overflow:hidden;border:1px solid var(--line)}
.shot div{width:100%;height:100%;background:center/cover;transition:transform 1.2s cubic-bezier(.2,.8,.2,1)}
.proj:hover .shot div{transform:scale(1.08)}
.type{font-size:12px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
.proj h3{font-size:clamp(40px,5vw,72px);margin:14px 0}
.proj p{color:var(--muted);margin-bottom:28px}
.lnk{display:inline-flex;gap:12px;align-items:center;border-bottom:1px solid var(--gold);padding-bottom:6px;transition:gap .3s,color .3s}
.lnk:hover{gap:22px;color:var(--gold2)}
/* contact */
#contact{max-width:none;background:radial-gradient(ellipse at 80% 20%,rgba(201,168,106,.18),transparent 55%),#0e0e10;border-top:1px solid var(--line)}
.cw{max-width:1200px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(36px,7vw,100px);align-items:center}
#contact h2{margin-bottom:28px}
.links{display:flex;gap:26px;flex-wrap:wrap;margin-top:34px}
.links a{border-bottom:1px solid var(--line);padding-bottom:4px;transition:.3s}.links a:hover{color:var(--gold2);border-color:var(--gold)}
form{display:grid;gap:16px}
input,textarea{width:100%;padding:20px 22px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);font:400 16px var(--b);transition:.3s}
input:hover,textarea:hover{border-color:rgba(201,168,106,.5)}input:focus,textarea:focus{border-color:var(--gold);outline:0;background:rgba(201,168,106,.06)}
textarea{min-height:150px;resize:vertical}
#st{min-height:26px;color:var(--gold2)}
#cart img{width:100%;height:auto;border-radius:26px;display:block;margin-bottom:24px;border:1px solid var(--line)}
footer{text-align:center;padding:30px;color:var(--muted);font-size:14px;border-top:1px solid var(--line)}
.rv{opacity:0;transform:translateY(50px);transition:opacity 1s,transform 1s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}
@media(max-width:860px){.about,.proj,.cw{grid-template-columns:1fr}.proj:nth-child(even) .shot{order:0}.spin{opacity:.25}.photo{max-width:420px;margin:auto}.btn{padding:18px 28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.w>span{transform:none}.rv{opacity:1;transform:none}.pre{display:none}}
</style>
</head>
<body>
<div class="pre" id="pre">N</div>
<div class="bar" id="bar"></div>
<div class="cur" id="cur"></div><div class="ring" id="ring"><b></b></div>
<a class="logo hov" href="#home" id="logo"></a>
<button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><i></i><i></i></button>
<nav id="nav" aria-label="Main"><div id="nl"></div></nav>
<button class="top" id="totop" aria-label="Back to top">&uarr;</button>
 
<main>
<section id="home">
  <div class="orb o1"></div><div class="orb o2"></div>
  <svg class="spin" viewBox="0 0 200 200" aria-hidden="true"><defs><path id="c" d="M100 100m-80 0a80 80 0 1 1 160 0a80 80 0 1 1-160 0"/></defs><circle cx="100" cy="100" r="96" fill="none" stroke="#c9a86a" stroke-opacity=".5"/><text fill="#c9a86a" font-size="13" letter-spacing="5" font-family="Inter,Arial"><textPath href="#c">DESIGN &#183; DEVELOP &#183; DELIVER &#183; DESIGN &#183; DEVELOP &#183; DELIVER &#183;</textPath></text></svg>
  <div class="hin">
    <span class="tag" id="h-tag"></span>
    <h1 id="h-title"></h1>
    <p class="lead" id="h-text"></p>
    <div class="btns"><a class="btn solid mag" href="#contact" id="h-cta"></a><a class="btn mag" href="#portfolio" id="h-cta2"></a></div>
  </div>
  <div class="scroll"></div>
</section>
<div class="marq" aria-hidden="true"><div id="mq"></div></div>
 
<section id="about">
  <div class="about">
    <div class="photo rv" id="a-photo" role="img" aria-label="Portrait" data-p=".06"></div>
    <div class="rv">
      <span class="tag">About me</span>
      <h2 id="a-title" style="margin-bottom:28px"></h2>
      <p id="a-bio"></p><p id="a-ap" style="margin-top:14px"></p>
      <div class="skills" id="a-sk"></div>
      <div class="stats" id="a-st"></div>
    </div>
  </div>
</section>
 
<section id="services">
  <span class="tag">Services</span>
  <h2>Crafted for those who <i>expect more</i></h2>
  <div class="grid" id="s-grid"></div>
</section>
 
<section id="portfolio">
  <span class="tag">Portfolio</span>
  <h2>Selected <i>work</i></h2>
  <div id="p-list"></div>
</section>
 
<section id="contact">
  <div class="cw">
    <div class="rv">
      <span class="tag">Contact</span>
      <h2 id="c-title"></h2>
      <p id="c-text" style="color:var(--muted)"></p>
      <div class="links" id="c-links"></div>
    </div>
    <div class="rv">
      <form id="form">
        <input name="name" placeholder="Your name" required aria-label="Name">
        <input name="email" type="email" placeholder="Your email" required aria-label="Email">
        <textarea name="message" placeholder="Tell me about your project" required aria-label="Message"></textarea>
        <input name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
        <button class="btn solid mag" type="submit">Send message</button>
        <p id="st" role="status"></p>
      </form>
      <div id="cart" hidden><img src="" alt="Illustration of an email envelope" width="800" height="700" loading="lazy"><a class="btn solid mag" id="c-mail" href="#">Write me an email</a></div>
    </div>
  </div>
</section>
</main>
<footer id="foot"></footer>
 
<script>
/* ===== START CONFIG ===== */
const CONFIG = {
  name: "Nick",                                    /* ЗМІНИТИ */
  email: "hello@example.com",                      /* ЗМІНИТИ */
  formEndpoint: "https://formspree.io/f/XXXXXXXX", /* ЗМІНИТИ */
  socials: [{label:"GitHub",url:"https://github.com/"},{label:"LinkedIn",url:"https://linkedin.com/"}], /* ЗМІНИТИ */
  home: {
    tag: "Independent web designer and developer",
    title: "Digital experiences that feel *priceless.*",   /* слова із * стають золотим курсивом */
    text: "I design and build premium websites that turn first impressions into loyal clients, with cinematic motion, flawless detail and speed you can feel.",
    cta: "Let's Work Together", cta2: "View my work"
  },
  marquee: ["Web Design","Development","Landing Pages","Branding","Redesign","Android Apps"],
  about: {
    photo: "",                                     /* ЗМІНИТИ: img/me.webp */
    title: "Where design meets <i>precision</i>",
    bio: "I am an independent designer and developer who takes a project from first sketch to a polished launch. Every layout, line of code and micro-interaction is made on purpose.",
    approach: "My process is simple: understand your goal, design with restraint, build for speed and accessibility, then refine until it feels effortless.",
    skills: ["Figma","HTML / CSS / JS","Motion design","Kotlin","Android","SEO","Performance"],
    stats: [{n:5,s:"+",t:"Years of craft"},{n:24,s:"+",t:"Projects shipped"},{n:100,s:"%",t:"Client focus"}]
  },
  services: [
    {t:"Website Design",d:"Bespoke interfaces with refined typography and a visual identity that is unmistakably yours."},
    {t:"Website Development",d:"Fast, responsive, accessible code with animation that delights and never gets in the way."},
    {t:"Landing Pages",d:"Single pages engineered to tell your story in seconds and convert visitors into clients."},
    {t:"Business Websites",d:"Credible, elegant company sites that build trust and generate qualified leads."},
    {t:"Website Redesign",d:"A complete transformation of a tired site into a modern, high-performing flagship."}
  ],
  projects: [                                      /* ЗМІНИТИ: додавайте об'єкти; image: "img/x.webp" */
    {title:"Holy Vibe",type:"Android app / Design and development",text:"A free Ukrainian Christian prayer and Bible verse app, designed and built end to end.",image:"",art:"phone",url:"#",link:"View project"},
    {title:"Maison Aurelle",type:"Landing page / Sample concept",text:"An editorial landing page for a luxury fragrance house, built around slow, cinematic scroll.",image:"",art:["#c9a86a","#8a3b5c"],url:"#",link:"View concept"},
    {title:"Northwind Capital",type:"Business website / Sample concept",text:"A calm, authoritative corporate site for a private investment firm, redesigned for trust.",image:"",art:["#5fa8d3","#c9a86a"],url:"#",link:"View concept"}
  ],
  contact: {
    showForm:false,                                /* ЗМІНИТИ: true, коли підключите Formspree */
    image:"",
    title: "Let's create something <i>extraordinary</i>",
    text: "Tell me about your idea. I reply within one business day."
  }
};
/* ===== END CONFIG ===== */
 
const $ = s => document.querySelector(s), C = CONFIG;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const svg = s => 'data:image/svg+xml,' + encodeURIComponent(s);
const G = (a,b) => `<linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a}"/><stop offset="1" stop-color="${b}"/></linearGradient><filter id="f"><feGaussianBlur stdDeviation="60"/></filter>`;
const webArt = (a,b) => svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs>${G(a,b)}</defs><rect width="1200" height="800" fill="#0d0d0f"/><circle cx="200" cy="150" r="280" fill="url(#g)" filter="url(#f)" opacity=".8"/><circle cx="1000" cy="700" r="260" fill="${b}" filter="url(#f)" opacity=".5"/><rect x="120" y="110" width="960" height="580" rx="26" fill="#111114" stroke="#ffffff33"/><circle cx="160" cy="146" r="7" fill="#ff5f57"/><circle cx="186" cy="146" r="7" fill="#febc2e"/><circle cx="212" cy="146" r="7" fill="#28c840"/><rect x="180" y="250" width="440" height="34" rx="8" fill="#f3ede2"/><rect x="180" y="300" width="340" height="34" rx="8" fill="url(#g)"/><rect x="180" y="370" width="380" height="12" rx="6" fill="#ffffff55"/><rect x="180" y="396" width="300" height="12" rx="6" fill="#ffffff33"/><rect x="180" y="450" width="160" height="48" rx="24" fill="url(#g)"/><rect x="700" y="230" width="320" height="400" rx="20" fill="url(#g)"/><circle cx="860" cy="400" r="90" fill="#0d0d0f" opacity=".35"/></svg>`);
const phoneArt = svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800"><defs>${G('#c9a86a','#f0d9a5')}</defs><rect width="1200" height="800" fill="#0d0d0f"/><circle cx="300" cy="220" r="300" fill="url(#g)" filter="url(#f)" opacity=".7"/><rect x="430" y="60" width="340" height="680" rx="48" fill="#f3ede2"/><rect x="458" y="96" width="284" height="608" rx="30" fill="#121214"/><rect x="490" y="150" width="130" height="14" rx="7" fill="#c9a86a"/><rect x="490" y="205" width="220" height="100" rx="16" fill="#26262a"/><rect x="490" y="325" width="220" height="100" rx="16" fill="#26262a"/><rect x="490" y="445" width="220" height="100" rx="16" fill="#26262a"/><rect x="490" y="605" width="220" height="44" rx="22" fill="url(#g)"/><rect x="850" y="260" width="220" height="14" rx="7" fill="#f3ede2"/><rect x="850" y="295" width="150" height="14" rx="7" fill="#9a9487"/></svg>`);
const portraitArt = svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000"><defs>${G('#c9a86a','#5b3a1c')}</defs><rect width="800" height="1000" fill="#111114"/><circle cx="400" cy="380" r="330" fill="url(#g)" filter="url(#f)" opacity=".8"/><circle cx="400" cy="400" r="125" fill="#f3ede2"/><path d="M120 1000c0-260 120-420 280-420s280 160 280 420z" fill="#f3ede2"/><circle cx="400" cy="400" r="300" fill="none" stroke="#c9a86a" stroke-opacity=".5"/></svg>`);
const mailArt = svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700"><defs>${G('#c9a86a','#f0d9a5')}</defs><rect width="800" height="700" fill="#121214"/><circle cx="620" cy="140" r="200" fill="url(#g)" filter="url(#f)" opacity=".8"/><rect x="120" y="230" width="560" height="340" rx="28" fill="#f3ede2"/><path d="M120 262l280 200 280-200" fill="none" stroke="#0a0a0b" stroke-width="14" stroke-linejoin="round"/><circle cx="400" cy="400" r="26" fill="url(#g)"/></svg>`);
 
/* render */
$('#logo').textContent = C.name;
$('#h-tag').textContent = C.home.tag;
$('#h-title').innerHTML = C.home.title.split(' ').map((w,i) => `<span class="w"><span style="--d:${i*90}ms">${w[0]==='*'?'<i>'+w.replace('*','').replace('*','')+'</i>':w}</span></span>`).join('');
$('#h-text').textContent = C.home.text;
$('#h-cta').textContent = C.home.cta; $('#h-cta2').textContent = C.home.cta2;
const mq = C.marquee.map(m => `<span>${m}</span><b>&#10022;</b>`).join('');
$('#mq').innerHTML = mq + mq + mq + mq;
$('#a-title').innerHTML = C.about.title;
$('#a-bio').textContent = C.about.bio; $('#a-ap').textContent = C.about.approach;
$('#a-sk').innerHTML = C.about.skills.map(s => `<span class="hov">${esc(s)}</span>`).join('');
$('#a-st').innerHTML = C.about.stats.map(s => `<div><b><span class="num" data-n="${s.n}">0</span>${esc(s.s)}</b>${esc(s.t)}</div>`).join('');
$('#a-photo').style.backgroundImage = `url("${C.about.photo || portraitArt}")`;
$('#s-grid').innerHTML = C.services.map((s,i) => `<article class="card tilt rv"><span class="n">0${i+1}</span><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></article>`).join('');
$('#p-list').innerHTML = C.projects.map(p => {
  const img = p.image || (p.art === 'phone' ? phoneArt : webArt(p.art[0], p.art[1]));
  return `<article class="proj rv"><a class="shot hov" href="${esc(p.url)}" aria-label="${esc(p.title)}"><div style="background-image:url('${esc(img)}')"></div></a><div><span class="type">${esc(p.type)}</span><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><a class="lnk" href="${esc(p.url)}">${esc(p.link)} <span>&rarr;</span></a></div></article>`;
}).join('');
$('#c-title').innerHTML = C.contact.title; $('#c-text').textContent = C.contact.text;
$('#c-links').innerHTML = `<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>` + C.socials.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('');
$('#cart img').src = C.contact.image || mailArt; $('#c-mail').href = 'mailto:' + C.email;
$('#form').hidden = !C.contact.showForm; $('#cart').hidden = C.contact.showForm;
$('#foot').textContent = `\u00A9 ${new Date().getFullYear()} ${C.name}. Crafted with care.`;
 
/* menu */
const items = [['home','Home'],['about','About Me'],['services','Services'],['portfolio','Portfolio'],['contact','Contact']];
const nav = $('#nav'), burger = $('#burger');
$('#nl').innerHTML = items.map(([id,l],i) => `<a href="#${id}" data-id="${id}"><small>0${i+1}</small>${l}</a>`).join('');
const setMenu = o => { nav.classList.toggle('open', o); burger.setAttribute('aria-expanded', o); document.body.style.overflow = o ? 'hidden' : ''; };
burger.onclick = () => setMenu(!nav.classList.contains('open'));
nav.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
const navLinks = [...nav.querySelectorAll('a')];
const spy = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) navLinks.forEach(a => a.classList.toggle('active', a.dataset.id === e.target.id)); }), {rootMargin:'-45% 0px -50% 0px'});
items.forEach(([id]) => spy.observe($('#'+id)));
 
/* reveal + counters */
const rv = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); rv.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll('.rv').forEach(el => rv.observe(el));
const cnt = new IntersectionObserver(es => es.forEach(e => {
  if (!e.isIntersecting) return; cnt.unobserve(e.target);
  const n = +e.target.dataset.n, t0 = performance.now();
  (function f(t){ const k = Math.min((t - t0) / 1600, 1); e.target.textContent = Math.round(n * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(f); })(t0);
}), {threshold:.6});
document.querySelectorAll('.num').forEach(el => cnt.observe(el));
 
/* scroll: progress, back to top, parallax */
const bar = $('#bar'), toTop = $('#totop'), par = [...document.querySelectorAll('[data-p]')];
let tick = false;
const onScroll = () => {
  const h = document.documentElement.scrollHeight - innerHeight;
  bar.style.transform = `scaleX(${h > 0 ? scrollY / h : 0})`;
  toTop.classList.toggle('show', scrollY > 700);
  par.forEach(el => { const r = el.getBoundingClientRect(); el.style.transform = `translateY(${(r.top + r.height / 2 - innerHeight / 2) * -parseFloat(el.dataset.p)}px)`; });
  tick = false;
};
addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(onScroll); } }, {passive:true});
onScroll();
toTop.onclick = () => scrollTo({top:0, behavior:'smooth'});
addEventListener('load', () => setTimeout(() => $('#pre').classList.add('off'), 700));
setTimeout(() => $('#pre').classList.add('off'), 2500);
 
/* custom cursor, magnetic buttons, tilt cards (only mouse devices) */
if (matchMedia('(hover:hover) and (pointer:fine)').matches) {
  document.body.classList.add('fc');
  const cur = $('#cur'), ring = $('#ring');
  let x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y;
  addEventListener('mousemove', e => { x = e.clientX; y = e.clientY; cur.style.transform = `translate(${x}px,${y}px)`; });
  (function loop(){ rx += (x - rx) * .16; ry += (y - ry) * .16; ring.style.transform = `translate(${rx}px,${ry}px)`; requestAnimationFrame(loop); })();
  document.addEventListener('mouseover', e => ring.classList.toggle('big', !!e.target.closest('a,button,.hov,.tilt,input,textarea')));
  document.querySelectorAll('.mag').forEach(b => {
    b.addEventListener('mousemove', e => { const r = b.getBoundingClientRect(); b.style.transform = `translate(${(e.clientX - r.left - r.width / 2) * .25}px,${(e.clientY - r.top - r.height / 2) * .35}px)`; });
    b.addEventListener('mouseleave', () => b.style.transform = '');
  });
  document.querySelectorAll('.tilt').forEach(c => {
    c.addEventListener('mousemove', e => { const r = c.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height;
      c.style.setProperty('--mx', px * 100 + '%'); c.style.setProperty('--my', py * 100 + '%');
      c.style.transform = `perspective(800px) rotateY(${(px - .5) * 10}deg) rotateX(${(.5 - py) * 10}deg) translateY(-6px)`; });
    c.addEventListener('mouseleave', () => c.style.transform = '');
  });
}
 
/* form */
$('#form').addEventListener('submit', async e => {
  e.preventDefault(); const st = $('#st'), f = e.target; st.textContent = 'Sending...';
  try {
    const r = await fetch(C.formEndpoint, {method:'POST', body:new FormData(f), headers:{Accept:'application/json'}});
    if (!r.ok) throw 0;
    f.reset(); st.textContent = 'Thank you. Your message has been sent. I will reply soon.';
  } catch { st.textContent = 'Something went wrong. Please email me directly.'; }
});
</script>
</body>
</html>
