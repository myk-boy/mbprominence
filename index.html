<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- ЗМІНИТИ: title і description (їх читають Google і месенджери) -->
<title>Nik | Web and Android Developer for Businesses</title>
<meta name="description" content="Independent developer building business websites, landing pages and Android apps. View selected work and send a project inquiry.">
<meta property="og:title" content="Nik | Web and Android Developer for Businesses">
<meta property="og:description" content="Business websites, landing pages and Android apps, built by one developer you can talk to directly.">
<meta name="theme-color" content="#F6F7F9">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F7F9;--surface:#FFFFFF;--text:#14171F;--muted:#5B6272;--border:#E3E6EC;
  --accent:#2547F5;--accentDark:#1A34C4;--accentText:#FFFFFF;
  --dark:#10131A;--darkText:#F2F4F8;--darkMuted:#A3AABB;--darkBorder:#262B38;
  --head:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--body);background:var(--bg);color:var(--text);line-height:1.65;font-size:17px;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--head);line-height:1.1;letter-spacing:-0.02em;margin:0}
p{margin:0}
section{scroll-margin-top:84px}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:6px}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
.sec{padding:88px 0}
.sec-head{max-width:640px;margin-bottom:44px}
.sec-head h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:14px}
.sec-head p{color:var(--muted)}
 
/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;padding:14px 26px;border-radius:12px;font:600 1rem var(--body);border:1px solid transparent;cursor:pointer;transition:transform .2s ease,background-color .2s ease,border-color .2s ease,box-shadow .2s ease;text-align:center}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn-primary{background:var(--accent);color:var(--accentText)!important}
.btn-primary:hover{background:var(--accentDark);box-shadow:0 8px 20px rgba(37,71,245,.25)}
.btn-ghost{background:var(--surface);color:var(--text)!important;border-color:var(--border)}
.btn-ghost:hover{border-color:var(--text)}
.btn-light{background:var(--darkText);color:var(--dark)!important}
.btn-light:hover{background:#fff}
.btn-outline{background:transparent;color:var(--darkText)!important;border-color:var(--darkBorder)}
.btn-outline:hover{border-color:var(--darkText)}
.btn-sm{padding:10px 18px;font-size:.95rem}
 
/* Header */
header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border)}
.bar{display:flex;align-items:center;height:68px}
.brand{font:700 1.3rem var(--head);letter-spacing:-0.02em}
.nav-links{display:flex;gap:28px;margin-left:auto;margin-right:24px}
.nav-links a{color:var(--muted);font-weight:500;font-size:.98rem;transition:color .2s}
.nav-links a:hover{color:var(--text)}
.bar-right{display:flex;align-items:center;gap:10px}
.burger{display:none;width:44px;height:44px;border:1px solid var(--border);background:var(--surface);border-radius:10px;cursor:pointer;padding:0;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.burger span{display:block;width:18px;height:2px;background:var(--text);transition:transform .25s ease,opacity .2s}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){opacity:0}
.burger[aria-expanded="true"] span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
 
/* Hero */
.hero{padding:72px 0 88px}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:56px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:10px;padding:7px 14px;border:1px solid var(--border);background:var(--surface);border-radius:999px;font-size:.9rem;color:var(--muted);margin-bottom:26px}
.dot{width:8px;height:8px;border-radius:50%;background:#1F9D55;box-shadow:0 0 0 0 rgba(31,157,85,.5);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,157,85,0)}100%{box-shadow:0 0 0 0 rgba(31,157,85,0)}}
.hero h1{font-size:clamp(2.5rem,6vw,4.6rem);margin-bottom:24px}
.hero-text{font-size:1.15rem;color:var(--muted);max-width:560px;margin-bottom:34px}
.btn-row{display:flex;flex-wrap:wrap;gap:12px}
.hero-visual{display:flex;justify-content:center}
 
/* Phone mockup */
.phone{width:270px;border:9px solid var(--dark);border-radius:38px;background:var(--dark);overflow:hidden;box-shadow:0 24px 48px rgba(16,19,26,.18);transition:transform .35s ease;flex:0 0 auto}
.phone:hover{transform:translateY(-6px) rotate(-1deg)}
.phone-screen{aspect-ratio:9/19;background:linear-gradient(160deg,#1c2340,#0c0f18);display:flex;align-items:center;justify-content:center;color:var(--darkText);font:700 1.4rem var(--head);text-align:center;padding:16px}
.phone-screen img{width:100%;height:100%;object-fit:cover}
.phone.sm{width:176px;border-width:7px;border-radius:28px;box-shadow:none}
.phone.sm .phone-screen{font-size:1rem}
 
/* Hero load animation: one orchestrated moment */
.rise{opacity:0;transform:translateY(18px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards;animation-delay:var(--d,0s)}
@keyframes rise{to{opacity:1;transform:none}}
 
/* Work */
.panel{background:var(--dark);color:var(--darkText);border-radius:24px;padding:44px;display:grid;grid-template-columns:.95fr 1.05fr;gap:44px;align-items:center}
.shots{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 4px 14px;justify-content:flex-start}
.shots .phone{scroll-snap-align:start}
.tag{display:inline-block;padding:5px 12px;border:1px solid var(--darkBorder);border-radius:999px;font-size:.85rem;color:var(--darkMuted);margin-bottom:18px}
.panel h3{font-size:clamp(1.7rem,3.4vw,2.4rem);margin-bottom:16px}
.panel p{color:var(--darkMuted);margin-bottom:26px}
.case{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px;margin-top:20px}
.case-item{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:28px;transition:border-color .2s,transform .2s}
.case-item:hover{border-color:var(--accent);transform:translateY(-3px)}
.case-item h4{font:700 1.15rem var(--head);margin:0 0 10px}
.case-item p{color:var(--muted);font-size:.98rem}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:6px 12px;border-radius:8px;background:var(--bg);border:1px solid var(--border);font-size:.9rem;font-weight:500}
.next{margin-top:28px;display:flex;flex-wrap:wrap;align-items:center;gap:18px;justify-content:space-between;padding:26px 30px;border:1px dashed var(--border);border-radius:18px;background:var(--surface)}
.next p{font:600 1.2rem var(--head);letter-spacing:-0.01em}
.project+.project{margin-top:56px}
 
/* Services */
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px;display:flex;flex-direction:column;transition:border-color .2s,transform .2s,box-shadow .2s}
.card:hover{border-color:var(--accent);transform:translateY(-4px);box-shadow:0 14px 30px rgba(20,23,31,.07)}
.card h3{font-size:1.35rem;margin-bottom:12px}
.card p{color:var(--muted);margin-bottom:16px}
.card ul{margin:0 0 22px;padding-left:18px;color:var(--muted);font-size:.95rem}
.card li{margin-bottom:4px}
.card a.more{margin-top:auto;font-weight:600;color:var(--accent)!important;border-bottom:2px solid transparent;align-self:flex-start;transition:border-color .2s}
.card a.more:hover{border-color:var(--accent)}
 
/* About */
.about{display:grid;grid-template-columns:1.1fr .9fr;gap:56px;align-items:start}
.about h2{font-size:clamp(1.9rem,4vw,2.8rem);margin-bottom:22px}
.about p+p{margin-top:16px}
.about p{color:var(--muted);max-width:60ch}
.photo{width:140px;height:140px;border-radius:50%;object-fit:cover;margin-bottom:24px;border:1px solid var(--border)}
.skills{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:30px}
.skills h3{font-size:1.25rem;margin-bottom:18px}
 
/* Process */
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.step{padding:26px;border-top:3px solid var(--border);background:var(--surface);border-radius:0 0 16px 16px;transition:border-color .25s}
.step:hover{border-color:var(--accent)}
.step b{display:flex;width:34px;height:34px;border-radius:50%;background:var(--accent);color:var(--accentText);align-items:center;justify-content:center;font:700 .95rem var(--head);margin-bottom:16px}
.step h3{font-size:1.2rem;margin-bottom:8px}
.step p{color:var(--muted);font-size:.98rem}
 
/* Contact */
.contact{background:var(--dark);color:var(--darkText);border-radius:28px;padding:56px;display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start}
.contact h2{font-size:clamp(1.9rem,4vw,2.7rem);margin-bottom:16px}
.contact .lead{color:var(--darkMuted);margin-bottom:26px}
.mail{display:inline-block;font:600 1.15rem var(--head);color:var(--darkText)!important;border-bottom:2px solid var(--accent);margin-bottom:20px}
.links{display:flex;flex-wrap:wrap;gap:14px}
.links a{color:var(--darkMuted)!important;font-size:.95rem;transition:color .2s}
.links a:hover{color:var(--darkText)!important}
form{background:var(--surface);color:var(--text);border-radius:18px;padding:28px;display:grid;gap:16px}
label{display:block;font-weight:600;font-size:.92rem;margin-bottom:6px}
input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:10px;font:400 1rem var(--body);background:var(--bg);color:var(--text);transition:border-color .2s,background-color .2s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(37,71,245,.15)}
textarea{min-height:130px;resize:vertical}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
#status{font-size:.95rem;min-height:1.4em;margin:0}
#status.ok{color:#1F7A44}
#status.err{color:#B42318}
button.btn{width:100%}
button.btn:disabled{opacity:.6;cursor:wait;transform:none}
 
/* Footer */
footer{background:var(--dark);color:var(--darkMuted);padding:48px 0 36px;margin-top:88px}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:28px}
.foot b{display:block;font:700 1.2rem var(--head);color:var(--darkText);margin-bottom:6px}
.foot nav{display:flex;flex-wrap:wrap;gap:20px}
.foot a{color:var(--darkMuted)!important;transition:color .2s}
.foot a:hover{color:var(--darkText)!important}
.copy{border-top:1px solid var(--darkBorder);margin-top:32px;padding-top:22px;font-size:.9rem}
 
/* Responsive */
@media(max-width:900px){
  .hero-grid,.panel,.about,.contact{grid-template-columns:1fr}
  .hero{padding:44px 0 64px}
  .sec{padding:64px 0}
  .panel{padding:28px}
  .contact{padding:30px}
  .burger{display:flex}
  .nav-links{position:absolute;top:100%;left:0;right:0;margin:0;flex-direction:column;gap:0;background:var(--surface);border-bottom:1px solid var(--border);padding:8px 24px;visibility:hidden;opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s,visibility .25s}
  .nav-links.open{visibility:visible;opacity:1;transform:none}
  .nav-links a{padding:14px 0;border-bottom:1px solid var(--border);color:var(--text)}
  .nav-links a:last-child{border-bottom:0}
}
@media(max-width:480px){
  body{font-size:16px}
  .wrap{padding:0 18px}
  .btn-row .btn{width:100%}
  .phone{width:230px}
  .brand{font-size:1.15rem}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .rise{opacity:1;transform:none}
}
</style>
</head>
<body id="top">
 
<header>
  <div class="wrap bar">
    <a class="brand" id="brand" href="#top"></a>
    <nav class="nav-links" id="navLinks" aria-label="Main"></nav>
    <div class="bar-right">
      <a class="btn btn-primary btn-sm" id="navBtn" href="#contact"></a>
      <button class="burger" id="burger" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="navLinks"><span></span><span></span><span></span></button>
    </div>
  </div>
</header>
 
<main>
  <section class="hero">
    <div class="wrap hero-grid">
      <div>
        <div class="pill rise" id="avail" style="--d:.05s"><i class="dot"></i><span id="availText"></span></div>
        <h1 class="rise" id="heroTitle" style="--d:.15s"></h1>
        <p class="hero-text rise" id="heroText" style="--d:.25s"></p>
        <div class="btn-row rise" style="--d:.35s">
          <a class="btn btn-primary" id="heroBtn1" href="#contact"></a>
          <a class="btn btn-ghost" id="heroBtn2" href="#work"></a>
        </div>
      </div>
      <div class="hero-visual rise" id="heroVisual" style="--d:.3s"></div>
    </div>
  </section>
 
  <section class="sec" id="work" style="padding-top:24px">
    <div class="wrap">
      <div class="sec-head"><h2 id="workTitle"></h2><p id="workText"></p></div>
      <div id="projects"></div>
    </div>
  </section>
 
  <section class="sec" id="services">
    <div class="wrap">
      <div class="sec-head"><h2 id="svcTitle"></h2><p id="svcText"></p></div>
      <div class="grid4" id="svcGrid"></div>
    </div>
  </section>
 
  <section class="sec" id="about">
    <div class="wrap about">
      <div id="aboutMain"></div>
      <div class="skills"><h3 id="skillsTitle"></h3><div class="chips" id="skills"></div></div>
    </div>
  </section>
 
  <section class="sec" id="process">
    <div class="wrap">
      <div class="sec-head"><h2 id="procTitle"></h2><p id="procText"></p></div>
      <div class="steps" id="steps"></div>
    </div>
  </section>
 
  <section class="sec" id="contact" style="padding-top:24px">
    <div class="wrap">
      <div class="contact">
        <div>
          <h2 id="cTitle"></h2>
          <p class="lead" id="cText"></p>
          <a class="mail" id="cMail" href="#"></a>
          <div class="links" id="cLinks"></div>
        </div>
        <form id="form" novalidate>
          <div><label for="f-name" id="l-name"></label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
          <div><label for="f-email" id="l-email"></label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
          <div><label for="f-type" id="l-type"></label><select id="f-type" name="project_type"></select></div>
          <div><label for="f-msg" id="l-msg"></label><textarea id="f-msg" name="message" required></textarea></div>
          <div class="hp" aria-hidden="true"><input type="text" name="_gotcha" tabindex="-1" autocomplete="off"></div>
          <button class="btn btn-primary" id="send" type="submit"></button>
          <p id="status" role="status" aria-live="polite"></p>
        </form>
      </div>
    </div>
  </section>
</main>
 
<footer>
  <div class="wrap">
    <div class="foot">
      <div><b id="fName"></b><span id="fRole"></span></div>
      <nav id="fNav" aria-label="Footer"></nav>
      <div><a id="fMail" href="#"></a></div>
    </div>
    <div class="copy" id="copy"></div>
  </div>
</footer>
 
<script>
/* =====================================================================
   CONFIG: весь контент і кольори сайту. Редагуйте ТІЛЬКИ тут.
   ===================================================================== */
var CONFIG = {
 
  /* ---------- КОЛЬОРИ ---------- */
  colors: {

  services: {
    title: "How I Can Help",                                /* ЗМІНИТИ */
    text: "Practical development services for businesses and entrepreneurs who need a reliable digital solution.",  /* ЗМІНИТИ */
    button: "Discuss This Service",                         /* ЗМІНИТИ */
    items: [                                                /* ЗМІНИТИ: картки (можна видалити четверту) */
      { title: "Business Websites", text: "Professional websites that explain your business, present your services, and give potential customers a clear way to contact you.", points: ["Company and service websites", "Multi-page websites", "Updates and improvements"], projectType: "Business website" },
      { title: "Landing Pages", text: "Focused landing pages designed to present a product or service clearly and guide visitors toward a specific action.", points: ["Product and service pages", "Promotional and lead-generation pages", "Mobile-friendly layouts"], projectType: "Landing page" },

      { title: "Custom Web Solutions", text: "Custom functionality and web-based tools designed to meet specific business requirements.", points: ["Interactive web tools", "Custom site features", "Practical integrations"], projectType: "Custom web solution" }
    ]
  },
 
  /* ---------- ПРО МЕНЕ ---------- */
  about: {
    title: "A Little About Me",                              /* ЗМІНИТИ */
    photo: "",                                              /* ЗМІНИТИ: напр. "img/me.jpg", порожнє = без фото */
    photoAlt: "Portrait of Nik",                            /* ЗМІНИТИ */
    paragraphs: [                                           /* ЗМІНИТИ: ваш текст */

    ],
    skillsTitle: "Tools I use",                             /* ЗМІНИТИ */
    skills: ["HTML and CSS", "JavaScript", "Java and Android", "Capacitor", "Git and GitHub", "Responsive design"]  /* ЗМІНИТИ: тільки те, що справді знаєте */
  },
 
  /* ---------- ЯК Я ПРАЦЮЮ ---------- */
  process: {
    title: "How I Work",                                    /* ЗМІНИТИ */
    text: "What happens after you get in touch, step by step.",  /* ЗМІНИТИ */
    steps: [                                                /* ЗМІНИТИ */
      { title: "Discuss", text: "We discuss your idea, goals, requirements, and priorities." },
      { title: "Plan", text: "I define the project scope, proposed solution, estimated timeline, and cost." },
      { title: "Build", text: "I develop the agreed solution and share progress at appropriate stages." },
      { title: "Deliver", text: "I test the finished work, deliver the agreed product, and explain the next steps." }

  },
 
  /* ---------- КОНТАКТИ ---------- */
  contact: {
    title: "Have a Project in Mind?",                       /* ЗМІНИТИ */
    text: "Tell me a little about what you want to build. I\u2019ll review your requirements and get back to you to discuss the next steps.",  /* ЗМІНИТИ */
    email: "hello@yourdomain.com",                          /* ЗМІНИТИ: ваш робочий email */
    formEndpoint: "",                                       /* ЗМІНИТИ: адреса Formspree, напр. "https://formspree.io/f/xxxxxxx"; порожнє = лист через поштову програму */
    links: [                                                /* ЗМІНИТИ: лише ті профілі, які ви реально ведете */
      { label: "GitHub", url: "https://github.com/myk-boy" }
    ],
    labels: { name: "Name", email: "Email address", type: "Project type", message: "Tell me about your project" },  /* ЗМІНИТИ */
    projectTypes: ["Business website", "Landing page", "Android application", "Custom web solution", "Something else"],  /* ЗМІНИТИ */
    button: "Send Project Inquiry",                         /* ЗМІНИТИ */
    sending: "Sending...",                                  /* ЗМІНИТИ */
    success: "Thank you. Your inquiry was sent, and I will reply by email soon.",   /* ЗМІНИТИ */
    mailtoNote: "Your email app should open with the message ready to send.",       /* ЗМІНИТИ */
    errorFields: "Please fill in your name, a valid email and a short description.",/* ЗМІНИТИ */
    errorSend: "The message could not be sent. Please try again or email me directly."  /* ЗМІНИТИ */
  },
 
  /* ---------- ФУТЕР ---------- */
  footer: { copyrightName: "Nik" }                          /* ЗМІНИТИ: ім'я в рядку копірайту */
};
 
/* =====================================================================
   НИЖЧЕ НІЧОГО МІНЯТИ НЕ ПОТРІБНО
   ===================================================================== */
(function(){
  var C = CONFIG;
  function $(id){ return document.getElementById(id); }
  function h(tag, cls, txt){ var e = document.createElement(tag); if(cls) e.className = cls; if(txt != null) e.textContent = txt; return e; }
  function link(label, url, cls){ var a = h("a", cls, label); a.href = url; return a; }
 
  /* colors */
  Object.keys(C.colors).forEach(function(k){ document.documentElement.style.setProperty("--" + k, C.colors[k]); });
 
  function phone(src, alt, label, small){
    var p = h("div", "phone" + (small ? " sm" : ""));
    var s = h("div", "phone-screen");
    if(src){ var i = document.createElement("img"); i.src = src; i.alt = alt; i.loading = "lazy"; s.appendChild(i); }
    else { s.textContent = label; s.setAttribute("role", "img"); s.setAttribute("aria-label", alt); }
    p.appendChild(s); return p;
  }
 
  /* header */
  $("brand").textContent = C.site.name;
  var nav = $("navLinks");
  C.nav.forEach(function(n){ nav.appendChild(link(n.label, n.href)); });
  $("navBtn").textContent = C.navButton;
  var burger = $("burger");
  function closeMenu(){ nav.classList.remove("open"); burger.setAttribute("aria-expanded", "false"); }
  burger.addEventListener("click", function(){
    var open = nav.classList.toggle("open");
    burger.setAttribute("aria-expanded", open ? "true" : "false");
  });
  nav.addEventListener("click", closeMenu);
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeMenu(); });
 
  /* hero */
  if(C.site.showAvailability){ $("availText").textContent = C.site.availabilityText; } else { $("avail").style.display = "none"; }
  $("heroTitle").textContent = C.hero.title;
  $("heroText").textContent = C.hero.text;
  $("heroBtn1").textContent = C.hero.primaryButton;
  $("heroBtn2").textContent = C.hero.secondaryButton;
  $("heroVisual").appendChild(phone(C.hero.image, C.hero.imageAlt, C.hero.fallbackLabel, false));
 
  /* work */
  $("workTitle").textContent = C.work.title;
  $("workText").textContent = C.work.text;
  C.work.projects.forEach(function(p){
    var art = h("article", "project");
    var panel = h("div", "panel");
    var shots = h("div", "shots");
    var list = (p.screenshots && p.screenshots.length) ? p.screenshots : [""];
    list.forEach(function(src, i){ shots.appendChild(phone(src, p.title + " screenshot " + (i + 1), C.hero.fallbackLabel, true)); });
    var info = h("div");
    info.appendChild(h("span", "tag", p.label));
    info.appendChild(h("h3", "", p.title));
    info.appendChild(h("p", "", p.description));
    var row = h("div", "btn-row");
    p.links.forEach(function(l){ if(l.url){ var a = link(l.label, l.url, "btn " + l.style); a.target = "_blank"; a.rel = "noopener"; row.appendChild(a); } });
    info.appendChild(row);
    panel.appendChild(shots); panel.appendChild(info); art.appendChild(panel);
 
    var grid = h("div", "case");
    p.caseStudy.forEach(function(c){
      var it = h("div", "case-item");
      it.appendChild(h("h4", "", c.title));
      if(c.text) it.appendChild(h("p", "", c.text));
      if(c.tech){ var ch = h("div", "chips"); c.tech.forEach(function(t){ ch.appendChild(h("span", "chip", t)); }); it.appendChild(ch); }
      grid.appendChild(it);
    });
    art.appendChild(grid);
    var next = h("div", "next");
    next.appendChild(h("p", "", p.nextText));
    next.appendChild(link(p.nextButton, "#contact", "btn btn-primary"));
    art.appendChild(next);
    $("projects").appendChild(art);
  });
 
  /* services */
  $("svcTitle").textContent = C.services.title;
  $("svcText").textContent = C.services.text;
  C.services.items.forEach(function(s){
    var card = h("div", "card");
    card.appendChild(h("h3", "", s.title));
    card.appendChild(h("p", "", s.text));
    var ul = h("ul"); s.points.forEach(function(x){ ul.appendChild(h("li", "", x)); }); card.appendChild(ul);
    var a = link(C.services.button, "#contact", "more");
    a.addEventListener("click", function(){ $("f-type").value = s.projectType; });
    card.appendChild(a);
    $("svcGrid").appendChild(card);
  });
 
  /* about */
  var am = $("aboutMain");
  if(C.about.photo){ var ph = h("img", "photo"); ph.src = C.about.photo; ph.alt = C.about.photoAlt; ph.width = 140; ph.height = 140; am.appendChild(ph); }
  am.appendChild(h("h2", "", C.about.title));
  C.about.paragraphs.forEach(function(t){ am.appendChild(h("p", "", t)); });
  $("skillsTitle").textContent = C.about.skillsTitle;
  C.about.skills.forEach(function(s){ $("skills").appendChild(h("span", "chip", s)); });
 
  /* process */
  $("procTitle").textContent = C.process.title;
  $("procText").textContent = C.process.text;
  C.process.steps.forEach(function(s, i){
    var d = h("div", "step");
    d.appendChild(h("b", "", String(i + 1)));
    d.appendChild(h("h3", "", s.title));
    d.appendChild(h("p", "", s.text));
    $("steps").appendChild(d);
  });
 
  /* contact */
  var K = C.contact;
  $("cTitle").textContent = K.title;
  $("cText").textContent = K.text;
  $("cMail").textContent = K.email;
  $("cMail").href = "mailto:" + K.email;
  K.links.forEach(function(l){ var a = link(l.label, l.url); a.target = "_blank"; a.rel = "noopener"; $("cLinks").appendChild(a); });
  $("l-name").textContent = K.labels.name;
  $("l-email").textContent = K.labels.email;
  $("l-type").textContent = K.labels.type;
  $("l-msg").textContent = K.labels.message;
  K.projectTypes.forEach(function(t){ var o = h("option", "", t); o.value = t; $("f-type").appendChild(o); });
  $("send").textContent = K.button;
 
  var form = $("form"), status = $("status"), send = $("send");
  function say(msg, cls){ status.textContent = msg; status.className = cls || ""; }
  form.addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("f-name").value.trim(), email = $("f-email").value.trim(), type = $("f-type").value, msg = $("f-msg").value.trim();
    if(!name || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || msg.length < 5){ say(K.errorFields, "err"); return; }
    if(form.elements["_gotcha"].value){ return; }
    if(!K.formEndpoint){
      var subject = "Project inquiry: " + type;
      var body = "Name: " + name + "\nEmail: " + email + "\nProject type: " + type + "\n\n" + msg;
      window.location.href = "mailto:" + K.email + "?subject=" + encodeURIComponent(subject) + "&body=" + encodeURIComponent(body);
      say(K.mailtoNote, "ok"); return;
    }
    send.disabled = true; send.textContent = K.sending; say("");
    fetch(K.formEndpoint, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ name: name, email: email, project_type: type, message: msg })
    }).then(function(r){
      if(!r.ok) throw new Error("bad status");
      form.reset(); say(K.success, "ok");
    }).catch(function(){
      say(K.errorSend, "err");
    }).then(function(){
      send.disabled = false; send.textContent = K.button;
    });
  });
 
  /* footer */
  $("fName").textContent = C.site.name;
  $("fRole").textContent = C.site.role;
  C.nav.forEach(function(n){ $("fNav").appendChild(link(n.label, n.href)); });
  $("fMail").textContent = K.email;
  $("fMail").href = "mailto:" + K.email;
  $("copy").textContent = "\u00a9 " + new Date().getFullYear() + " " + C.footer.copyrightName + ". " + C.site.role + ".";
})();
</script>
</body>
</html>
