<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nick - Web Designer and Developer</title>
<meta name="description" content="Independent web designer and developer. Websites, landing pages and Android apps that look sharp and convert.">
<meta property="og:title" content="Nick - Web Designer and Developer">
<meta property="og:description" content="Independent web designer and developer building premium websites and apps.">
<meta property="og:type" content="website">
<meta property="og:image" content="img/og.webp"><!-- ЗМІНИТИ: картинка для поширення -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f0e8; --ink:#121210; --muted:#5d5a52; --card:#fffdf8;
  --accent:#ff4d1c; --line:#d9d3c6; /* ЗМІНИТИ: кольори */
  --h:'Bricolage Grotesque',Arial,sans-serif; --b:'Inter',Arial,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font:400 17px/1.6 var(--b)}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
section{padding:clamp(80px,12vw,160px) clamp(20px,6vw,96px);max-width:1360px;margin:auto}
h1,h2,h3{font-family:var(--h);line-height:1.02;letter-spacing:-.03em}
h1{font-size:clamp(46px,9vw,130px);font-weight:800}
h2{font-size:clamp(36px,6vw,84px);font-weight:800;margin-bottom:48px}
h3{font-size:24px;font-weight:700;letter-spacing:-.01em}
.tag{font:500 13px var(--b);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:24px;display:block}
em{font-style:normal;color:var(--accent)}
.btn{display:inline-block;background:var(--ink);color:var(--bg);padding:18px 34px;border-radius:99px;text-decoration:none;font:500 16px var(--b);border:0;cursor:pointer;transition:.25s}
.btn:hover{background:var(--accent);transform:translateY(-3px)}
.btn:active{transform:none}
/* HOME */
#home{min-height:100vh;display:grid;align-content:center;gap:36px;position:relative}
#home p.lead{max-width:560px;font-size:20px;color:var(--muted)}
.orb{position:absolute;right:6vw;top:14vh;width:clamp(120px,22vw,300px);aspect-ratio:1;border-radius:50%;background:var(--accent);animation:float 8s ease-in-out infinite;z-index:-1}
@keyframes float{50%{transform:translateY(24px) scale(1.04)}}
/* ABOUT */
.about{display:grid;grid-template-columns:1fr 1.3fr;gap:clamp(32px,6vw,90px);align-items:start}
.photo{aspect-ratio:4/5;border-radius:24px;background:var(--ink) center/cover;display:grid;place-items:end start;padding:20px;color:var(--bg);font-family:var(--h);font-size:22px}
.skills{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.skills span{border:1px solid var(--line);padding:8px 18px;border-radius:99px;font-size:15px;background:var(--card)}
.stats{display:flex;gap:40px;margin-top:36px}
.stats b{font:800 44px var(--h);display:block}
/* SERVICES */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:32px;transition:.3s}
.card:hover{transform:translateY(-6px);border-color:var(--ink)}
.card .n{font:800 14px var(--h);color:var(--accent);display:block;margin-bottom:56px}
.card p{color:var(--muted);margin-top:12px;font-size:16px}
/* PORTFOLIO */
.proj{display:grid;grid-template-columns:1.2fr 1fr;gap:clamp(24px,5vw,72px);align-items:center;padding:40px 0;border-top:1px solid var(--line)}
.proj:nth-child(even) .shot{order:2}
.shot{aspect-ratio:16/11;border-radius:24px;background:var(--ink) center/cover;overflow:hidden;display:grid;place-items:center;color:var(--accent);font:800 28px var(--h);transition:.4s}
.proj:hover .shot{transform:scale(.98)}
.proj .type{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.proj h3{font-size:clamp(30px,4vw,52px);margin:12px 0}
.proj p{color:var(--muted);margin-bottom:24px}
.proj a{font-weight:500;text-underline-offset:6px}
/* CONTACT */
#contact{background:var(--ink);color:var(--bg);max-width:none;border-radius:40px 40px 0 0}
.cwrap{max-width:1100px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,6vw,90px)}
#contact h2{margin-bottom:24px}
form{display:grid;gap:16px}
input,textarea{width:100%;padding:18px 20px;border-radius:14px;border:1px solid #444;background:#1d1d1a;color:var(--bg);font:400 16px var(--b)}
input:focus,textarea:focus{border-color:var(--accent);outline:0}
textarea{min-height:140px;resize:vertical}
#contact .btn{background:var(--accent);color:#fff}
#contact .btn:hover{background:var(--bg);color:var(--ink)}
.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:24px}
#status{min-height:24px;color:var(--accent)}
[hidden]{display:none!important}
#c-art img{width:100%;height:auto;border-radius:24px;display:block;margin-bottom:20px}
footer{background:var(--ink);color:#8d897c;text-align:center;padding:24px;font-size:14px}
/* MENU */
.burger{position:fixed;right:20px;top:20px;z-index:30;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);cursor:pointer;display:grid;place-content:center;gap:6px;transition:.25s}
.burger:hover{background:var(--accent)}
.burger i{display:block;width:24px;height:2px;background:#fff;transition:.3s}
.burger[aria-expanded=true] i:nth-child(1){transform:translateY(8px) rotate(45deg)}
.burger[aria-expanded=true] i:nth-child(2){opacity:0}
.burger[aria-expanded=true] i:nth-child(3){transform:translateY(-8px) rotate(-45deg)}
nav{position:fixed;right:20px;top:88px;z-index:29;background:var(--ink);border-radius:24px;padding:12px;width:min(260px,calc(100vw - 40px));opacity:0;visibility:hidden;transform:translateY(-10px) scale(.97);transform-origin:top right;transition:.25s}
nav.open{opacity:1;visibility:visible;transform:none}
nav a{display:block;padding:14px 18px;border-radius:14px;color:#aaa69a;text-decoration:none;font:500 18px var(--h)}
nav a:hover{color:#fff}
nav a.active{background:var(--accent);color:#fff}
.top{position:fixed;right:20px;bottom:20px;z-index:20;width:48px;height:48px;border-radius:50%;border:1px solid var(--ink);background:var(--bg);cursor:pointer;opacity:0;pointer-events:none;transition:.3s;font-size:20px}
.top.show{opacity:1;pointer-events:auto}
.top:hover{background:var(--ink);color:var(--bg)}
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s,transform .8s}
.rv.in{opacity:1;transform:none}
@media(max-width:800px){.about,.proj,.cwrap{grid-template-columns:1fr}.proj:nth-child(even) .shot{order:0}.orb{opacity:.35}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<button class="burger" id="burger" aria-label="Menu" aria-expanded="false"><i></i><i></i><i></i></button>
<nav id="nav" aria-label="Main"></nav>
<button class="top" id="top" aria-label="Back to top">&uarr;</button>
 
<main>
<section id="home">
  <div class="orb" aria-hidden="true"></div>
  <span class="tag" id="h-tag"></span>
  <h1 id="h-title"></h1>
  <p class="lead" id="h-text"></p>
  <div><a class="btn" href="#contact" id="h-cta"></a></div>
</section>
 
<section id="about">
  <span class="tag">About me</span>
  <div class="about">
    <div class="photo rv" id="a-photo"></div>
    <div class="rv">
      <h2 id="a-title"></h2>
      <p id="a-bio"></p>
      <p id="a-approach" style="margin-top:16px;color:var(--muted)"></p>
      <div class="skills" id="a-skills"></div>
      <div class="stats" id="a-stats"></div>
    </div>
  </div>
</section>
 
<section id="services">
  <span class="tag">Services</span>
  <h2>What I can build for you</h2>
  <div class="grid" id="s-grid"></div>
</section>
 
<section id="portfolio">
  <span class="tag">Portfolio</span>
  <h2>Selected work</h2>
  <div id="p-list"></div>
</section>
 
<section id="contact">
  <div class="cwrap">
    <div class="rv">
      <span class="tag">Contact</span>
      <h2 id="c-title"></h2>
      <p id="c-text" style="color:#aaa69a"></p>
      <div class="links" id="c-links"></div>
    </div>
    <form id="form" class="rv">
      <input name="name" placeholder="Your name" required aria-label="Name">
      <input name="email" type="email" placeholder="Your email" required aria-label="Email">
      <textarea name="message" placeholder="Tell me about your project" required aria-label="Message"></textarea>
      <input name="_gotcha" style="display:none" tabindex="-1" autocomplete="off">
      <button class="btn" type="submit">Send message</button>
      <p id="status" role="status"></p>
    </form>
    <div id="c-art" class="rv" hidden>
      <img src="" alt="Illustration of an email envelope" width="800" height="700" loading="lazy">
      <a class="btn" id="c-mail" href="#">Write me an email</a>
    </div>
  </div>
</section>
</main>
<footer id="foot"></footer>
 
<script>
/* ===== START CONFIG: уся інформація сайту тут ===== */
const CONFIG = {
  name: "Nick",                                   /* ЗМІНИТИ */
  formEndpoint: "https://formspree.io/f/XXXXXXXX", /* ЗМІНИТИ: ваш Formspree endpoint */
  email: "hello@example.com",                     /* ЗМІНИТИ */
  socials: [                                      /* ЗМІНИТИ: або видаліть зайве */
    {label:"GitHub", url:"https://github.com/"},
    {label:"LinkedIn", url:"https://linkedin.com/"}
  ],
  home: {
    tag: "Independent web designer and developer",          /* ЗМІНИТИ */
    title: "I design websites that <em>earn trust</em> and bring clients.", /* ЗМІНИТИ */
    text: "Clean design, fast code, clear message. From landing pages to full business websites and Android apps.", /* ЗМІНИТИ */
    cta: "Let's Work Together"
  },
  about: {
    photo: "",                                    /* ЗМІНИТИ: напр. img/me.webp */
    title: "Design with a reason, code that works.", /* ЗМІНИТИ */
    bio: "I am an independent designer and developer who builds websites and Android apps end to end.", /* ЗМІНИТИ */
    approach: "I start with your goal, design only what supports it, and ship fast, accessible, easy-to-edit work.", /* ЗМІНИТИ */
    skills: ["Figma","HTML / CSS / JS","Kotlin","Android","SEO","Performance"], /* ЗМІНИТИ */
    stats: [{n:"5+",t:"years"},{n:"20+",t:"projects"}]     /* ЗМІНИТИ */
  },
  services: [
    {t:"Website Design", d:"Distinct, modern interfaces built around your brand and goals."},
    {t:"Website Development", d:"Fast, responsive, clean code that is easy to maintain."},
    {t:"Landing Pages", d:"Focused single pages for products and campaigns that convert."},
    {t:"Business Websites", d:"Credible company sites that explain what you do and win leads."},
    {t:"Website Redesign", d:"A fresh look and better results for a site that feels outdated."}
  ],
  projects: [                                     /* ЗМІНИТИ: додавайте нові об'єкти сюди */
    {
      title: "Holy Vibe",
      type: "Android app / Design and development",
      text: "A free Ukrainian Christian prayer and Bible verse app, designed and built solo.",
      image: "",                                  /* напр. img/holyvibe.webp */
      url: "#",                                   /* посилання на Google Play */
      linkText: "View project"
    }
  ],
  contact: {
    showForm: false,   /* ЗМІНИТИ: поставте true, коли підключите Formspree; тоді замість картинки буде форма */
    image: "",         /* ЗМІНИТИ: своя картинка замість заглушки, напр. img/contact.webp */
    title: "Have a project? Let's talk.",
    text: "Tell me what you need and I will reply within one business day."
  }
};
/* ===== END CONFIG ===== */
 
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const C = CONFIG;
 
$('#h-tag').textContent = C.home.tag;
$('#h-title').innerHTML = C.home.title;
$('#h-text').textContent = C.home.text;
$('#h-cta').textContent = C.home.cta;
$('#a-title').textContent = C.about.title;
$('#a-bio').textContent = C.about.bio;
$('#a-approach').textContent = C.about.approach;
$('#a-skills').innerHTML = C.about.skills.map(s => `<span>${esc(s)}</span>`).join('');
$('#a-stats').innerHTML = C.about.stats.map(s => `<div><b>${esc(s.n)}</b>${esc(s.t)}</div>`).join('');
/* вбудовані картинки-заглушки (SVG); зникають, коли ви вкажете свої фото в CONFIG */
const svg = s => 'data:image/svg+xml,' + encodeURIComponent(s);
const portraitArt = svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000"><rect width="800" height="1000" fill="#121210"/><circle cx="400" cy="330" r="300" fill="#ff4d1c"/><circle cx="400" cy="400" r="120" fill="#f4f0e8"/><path d="M130 1000c0-250 120-400 270-400s270 150 270 400z" fill="#f4f0e8"/><rect x="60" y="60" width="150" height="14" rx="7" fill="#f4f0e8"/><rect x="60" y="90" width="90" height="14" rx="7" fill="#ff4d1c"/></svg>`);
const phoneArt = svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 760"><rect width="1100" height="760" fill="#1d1d1a"/><circle cx="260" cy="200" r="260" fill="#ff4d1c"/><rect x="380" y="70" width="340" height="640" rx="44" fill="#f4f0e8"/><rect x="410" y="110" width="280" height="560" rx="28" fill="#121210"/><rect x="440" y="160" width="140" height="14" rx="7" fill="#ff4d1c"/><rect x="440" y="210" width="220" height="90" rx="14" fill="#2c2c28"/><rect x="440" y="320" width="220" height="90" rx="14" fill="#2c2c28"/><rect x="440" y="430" width="220" height="90" rx="14" fill="#2c2c28"/><rect x="440" y="580" width="220" height="40" rx="20" fill="#ff4d1c"/><rect x="800" y="150" width="200" height="14" rx="7" fill="#f4f0e8"/><rect x="800" y="185" width="140" height="14" rx="7" fill="#8d897c"/></svg>`);
const mailArt = svg(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700"><rect width="800" height="700" rx="40" fill="#1d1d1a"/><circle cx="600" cy="150" r="170" fill="#ff4d1c"/><rect x="120" y="230" width="560" height="340" rx="28" fill="#f4f0e8"/><path d="M120 260l280 200 280-200" fill="none" stroke="#121210" stroke-width="14" stroke-linejoin="round"/><rect x="120" y="90" width="260" height="16" rx="8" fill="#f4f0e8"/><rect x="120" y="125" width="170" height="16" rx="8" fill="#8d897c"/></svg>`);
$('#a-photo').style.backgroundImage = `url("${C.about.photo || portraitArt}")`;
$('#c-art img').src = C.contact.image || mailArt;
$('#c-mail').href = 'mailto:' + C.email;
$('#form').hidden = !C.contact.showForm;
$('#c-art').hidden = C.contact.showForm;
$('#s-grid').innerHTML = C.services.map((s,i) => `<article class="card rv"><span class="n">0${i+1}</span><h3>${esc(s.t)}</h3><p>${esc(s.d)}</p></article>`).join('');
$('#p-list').innerHTML = C.projects.map(p => `<article class="proj rv"><div class="shot" role="img" aria-label="${esc(p.title)}" style="background-image:url('${esc(p.image || phoneArt)}')"></div><div><span class="type">${esc(p.type)}</span><h3>${esc(p.title)}</h3><p>${esc(p.text)}</p><a href="${esc(p.url)}">${esc(p.linkText)} &rarr;</a></div></article>`).join('');
$('#c-title').textContent = C.contact.title;
$('#c-text').textContent = C.contact.text;
$('#c-links').innerHTML = `<a href="mailto:${esc(C.email)}">${esc(C.email)}</a>` + C.socials.map(s => `<a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join('');
$('#foot').textContent = `\u00A9 ${new Date().getFullYear()} ${C.name}`;
 
/* menu */
const items = [['home','Home'],['about','About Me'],['services','Services'],['portfolio','Portfolio'],['contact','Contact']];
const nav = $('#nav'), burger = $('#burger');
nav.innerHTML = items.map(([id,l]) => `<a href="#${id}" data-id="${id}">${l}</a>`).join('');
const setMenu = o => { nav.classList.toggle('open', o); burger.setAttribute('aria-expanded', o); };
burger.onclick = () => setMenu(!nav.classList.contains('open'));
nav.addEventListener('click', e => { if (e.target.closest('a')) setMenu(false); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
 
/* active section + reveal + back to top */
const links = [...nav.querySelectorAll('a')];
const spy = new IntersectionObserver(es => es.forEach(e => {
  if (e.isIntersecting) links.forEach(a => a.classList.toggle('active', a.dataset.id === e.target.id));
}), {rootMargin:'-45% 0px -50% 0px'});
items.forEach(([id]) => spy.observe($('#'+id)));
const rv = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); rv.unobserve(e.target); } }), {threshold:.12});
document.querySelectorAll('.rv').forEach(el => rv.observe(el));
const toTop = $('#top');
addEventListener('scroll', () => toTop.classList.toggle('show', scrollY > 700), {passive:true});
toTop.onclick = () => scrollTo({top:0, behavior:'smooth'});
 
/* form */
$('#form').addEventListener('submit', async e => {
  e.preventDefault();
  const st = $('#status'), f = e.target;
  st.textContent = 'Sending...';
  try {
    const r = await fetch(C.formEndpoint, {method:'POST', body:new FormData(f), headers:{Accept:'application/json'}});
    if (!r.ok) throw 0;
    f.reset(); st.textContent = 'Thank you! Your message has been sent. I will reply soon.';
  } catch { st.textContent = 'Something went wrong. Please email me directly.'; }
});
</script>
</body>
</html>
